<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.xuehanyu.org/quiz.html">

<meta property="og:title" content="Quiz d'images — Vocabulaire HSK 1 | xuehanyu.org">
<meta property="og:description" content="Apprenez le vocabulaire HSK 1 par l'image : flashcards illustrées et quiz à choix multiples.">
<meta property="og:locale" content="fr_FR">
<meta property="og:locale:alternate" content="en_GB">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Quiz d'images — Vocabulaire HSK 1">
<meta name="twitter:description" content="Flashcards illustrées et quiz à choix multiples pour le vocabulaire HSK 1.">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#fffbf2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="xuehanyu">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" integrity="sha384-/o6I2CkkWC//PSjvWC/eYN7l3xM3tJm8ZzVkCOfp//W05QcE3mlGskpoHB6XqI+B" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="fonts/manrope.css?v=20261107l">
<link rel="stylesheet" href="style.css?v=20261107l">
<link rel="stylesheet" href="quiz.css?v=20261107l">
</head>
<body class="quiz-body">

<div id="paper-bg" aria-hidden="true"></div>

<div class="app quiz-app">

  <header class="topbar">
    <a class="brand" href="index.html" aria-label="xuehanyu.org"><span class="zh" lang="zh-Hans">学汉语</span><span class="brand-name sr-only">xuehanyu.org</span></a>
    <div class="header-right">
      <div class="lang-switch" role="group" aria-label="Language">
        <button data-lang="fr" class="active">FR</button>
        <button data-lang="en">EN</button>
      </div>
    </div>
  </header>

  <nav class="site-nav" aria-label="Navigation">
    <a href="index.html"><i class="fa-solid fa-house"></i><span data-i18n="navHome">Accueil</span></a>
    <a href="app.html"><i class="fa-solid fa-book-open"></i><span data-i18n="navDict">Dictionnaire</span></a>
    <a href="quiz.html" aria-current="page"><i class="fa-solid fa-images"></i><span data-i18n="navQuiz">Quiz d'images</span></a>
    <a href="lessons.html"><i class="fa-solid fa-comments"></i><span data-i18n="navLessons">Leçons</span></a>
  </nav>

  <main class="quiz-main">

    <!-- ============ HUB: stats, level, exercise ============ -->
    <section class="hub" id="hub">

      <h1 class="hub-title" data-i18n="hubTitle">Pratique du jour</h1>

      <div class="stats">
        <div class="stat card">
          <span class="stat-icon flame"><i class="fa-solid fa-fire"></i></span>
          <div class="stat-body"><b id="statStreak">0</b><span data-i18n="statStreak">jours de suite</span></div>
        </div>
        <div class="stat card">
          <div class="ring" id="goalRing" style="--p:0"><span id="goalText">0</span></div>
          <div class="stat-body"><b id="goalSub">0 / 10</b><span data-i18n="statGoal">Objectif du jour</span></div>
        </div>
        <div class="stat card">
          <span class="stat-icon due"><i class="fa-solid fa-calendar-check"></i></span>
          <div class="stat-body"><b id="statDue">0</b><span data-i18n="statDue">mots à réviser</span></div>
        </div>
      </div>

      <p class="hub-hint" data-i18n="hubHint">Objectif : pratiquer 10 mots par jour.</p>

      <button class="due-cta" id="dueBtn" hidden>
        <span class="due-cta-icon"><i class="fa-solid fa-bolt"></i></span>
        <span class="due-cta-text"><b id="dueBtnTitle">Réviser maintenant</b><span id="dueBtnSub"></span></span>
        <i class="fa-solid fa-chevron-right"></i>
      </button>

      <div class="card setup">
        <h2 class="setup-h" data-i18n="setupLevel">Niveau</h2>
        <nav class="seg level-tabs" id="levelTabs" aria-label="Niveau"></nav>
        <div class="mastery">
          <div class="mastery-bar" role="presentation"><i id="masteryFill"></i></div>
          <span id="masteryText"></span>
        </div>

        <h2 class="setup-h" data-i18n="setupMode">Exercice</h2>
        <div class="mode-grid" id="modeTabs" role="group" aria-label="Exercice">
          <button class="mode-tab active" data-mode="cards" aria-pressed="true">
            <i class="fa-regular fa-clone"></i>
            <b data-i18n="modeCards">Cartes</b>
            <span data-i18n="modeCardsHint">Retrouve le mot, puis note-toi</span>
          </button>
          <button class="mode-tab" data-mode="img2word" aria-pressed="false">
            <i class="fa-solid fa-image"></i>
            <b data-i18n="modeImg2Word">Image → Mot</b>
            <span data-i18n="modeImg2WordHint">Quel mot va avec l'image&nbsp;?</span>
          </button>
          <button class="mode-tab" data-mode="word2img" aria-pressed="false">
            <i class="fa-solid fa-language"></i>
            <b data-i18n="modeWord2Img">Mot → Image</b>
            <span data-i18n="modeWord2ImgHint">Quelle image va avec le mot&nbsp;?</span>
          </button>
        </div>

        <button class="switch-row" id="reviewToggle" role="switch" aria-checked="false">
          <span class="switch"><i></i></span>
          <span id="reviewToggleLabel">À revoir seulement</span>
        </button>

        <button class="btn primary big" id="startBtn"><span id="startBtnLabel">Commencer</span><i class="fa-solid fa-arrow-right"></i></button>
      </div>

      <p class="hub-note" id="hubNote" role="status"></p>
    </section>

    <!-- ============ SESSION: one question at a time ============ -->
    <section class="session" id="session" hidden>
      <div class="session-top">
        <button class="btn icon" id="sessionClose" aria-label="Quitter"><i class="fa-solid fa-xmark"></i></button>
        <div class="progress-track" id="progressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="quiz-meta"><span id="progressText">—</span><span id="scoreText" class="score-text"></span></div>
      </div>
      <div id="quizStage" class="quiz-stage" aria-live="polite"></div>
      <div class="dock" id="dock"></div>
    </section>

  </main>

  <footer class="quiz-footer">
    <span>
      <span id="footerNote">Illustrations générées pour ce projet · vocabulaire HSK 1</span>
      · <span id="quizVersion"></span>
    </span>
  </footer>

</div>

<script src="srs.js?v=20261107l"></script>
<script src="progress.js?v=20261107l"></script>
<script src="quiz.js?v=20261107l"></script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js?v=20261107l'));</script>
</body>
</html>
